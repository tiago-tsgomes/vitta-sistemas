<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Acesso Restrito — Vitta</title>
  <link rel="icon" type="image/png" href="../img/favicon.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{vitta:{50:'#f0fbfd',500:'#2ABCD4',600:'#1a96ac'}},fontFamily:{sans:['Montserrat','system-ui','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <style>*{-webkit-tap-highlight-color:transparent}body{overscroll-behavior:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
</head>
<body class="bg-white font-sans antialiased min-h-screen flex flex-col items-center justify-center px-8 text-center">

  <div class="w-full max-w-sm">
    <img src="../img/logo.png" alt="Vitta Sistemas" class="h-14 w-auto mx-auto mb-8"/>

    <div class="w-20 h-20 rounded-full bg-amber-50 border-2 border-amber-200 flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
    </div>

    <h1 class="text-[1.35rem] font-extrabold text-gray-800 mb-3">Versão Mobile Restrita</h1>
    <p class="text-gray-500 text-[0.9rem] leading-relaxed mb-8">
      Esta versão mobile é exclusiva para <strong class="text-gray-700">Profissionais</strong>.<br/><br/>
      Para acessar o sistema com seu perfil, utilize a <strong class="text-gray-700">versão web</strong> em um computador ou navegador desktop.
    </p>

    <div class="space-y-3">
      <button onclick="handleLogout()"
        class="w-full py-4 bg-vitta-500 text-white rounded-2xl font-bold text-sm shadow-sm active:bg-vitta-600 transition-colors">
        Sair e Fazer Novo Login
      </button>
    </div>

    <p class="text-[0.72rem] text-gray-400 mt-8">Vitta Sistemas &mdash; Gestão Clínica</p>
  </div>

<script>
  async function handleLogout(){
    try { await Capacitor.Plugins.Preferences.remove({ key: 'vitta_session' }); } catch(e) {}
    await supabase.auth.signOut();
    window.location.href='../index.html';
  }
</script>
</body>
</html>
