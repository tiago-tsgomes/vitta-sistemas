<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Agenda — Vitta</title>
  <link rel="icon" type="image/png" href="../img/favicon.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{vitta:{50:'#f0fbfd',100:'#e0f7fa',400:'#4dd9ed',500:'#2ABCD4',600:'#1a96ac'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <link rel="stylesheet" href="../assets/css/mobile-dark.css"/>
  <script src="../assets/js/mobile-utils.js"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent}
    body{overscroll-behavior-y:none}
    ::-webkit-scrollbar{display:none}
    .safe-top{padding-top:env(safe-area-inset-top)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .25s ease forwards}
    .sheet{transition:transform .3s ease,opacity .25s ease}
    .sheet.open{transform:translateY(0)!important;opacity:1!important}
  </style>
</head>
<body class="bg-[#F0F2F5] font-sans antialiased">

<!-- HEADER -->
<header class="fixed top-0 left-0 right-0 z-20 bg-white border-b border-gray-100 safe-top">
  <div class="h-14 flex items-center px-4 gap-3">
    <div class="flex-1">
      <h1 class="text-[1rem] font-bold text-gray-800">Agenda</h1>
    </div>
    <button id="hdr-av" onclick="window.location.href='perfil.html'" class="w-8 h-8 rounded-full bg-vitta-500 flex items-center justify-center text-white text-xs font-bold">A</button>
  </div>
  <!-- Date nav -->
  <div class="flex items-center px-4 pb-2.5 gap-2">
    <button onclick="navDay(-1)" class="p-2 rounded-xl bg-gray-100 text-gray-500 active:bg-gray-200">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="flex-1 text-center">
      <p id="date-label" class="text-[0.88rem] font-bold text-gray-800"></p>
      <p id="date-rel" class="text-[0.65rem] text-vitta-500 font-semibold h-3"></p>
    </div>
    <button onclick="navDay(1)" class="p-2 rounded-xl bg-gray-100 text-gray-500 active:bg-gray-200">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button onclick="goToday()" class="px-3 py-1.5 bg-vitta-500 text-white text-[0.72rem] font-bold rounded-xl">Hoje</button>
  </div>
</header>

<!-- MAIN -->
<main id="main-content" style="padding-top:calc(100px + env(safe-area-inset-top));padding-bottom:calc(80px + env(safe-area-inset-bottom))" class="px-4 py-2 min-h-screen">
  <div id="agd-list" class="space-y-2">
    <div id="agd-skeleton" class="space-y-2">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center gap-3"><div class="w-10 h-10 rounded bg-gray-200 shrink-0"></div><div class="w-10 h-10 rounded-xl bg-gray-200 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3.5 rounded-full bg-gray-200 w-3/4"></div><div class="h-3 rounded-full bg-gray-200 w-1/2"></div></div></div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center gap-3"><div class="w-10 h-10 rounded bg-gray-200 shrink-0"></div><div class="w-10 h-10 rounded-xl bg-gray-200 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3.5 rounded-full bg-gray-200 w-2/3"></div><div class="h-3 rounded-full bg-gray-200 w-2/5"></div></div></div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center gap-3"><div class="w-10 h-10 rounded bg-gray-200 shrink-0"></div><div class="w-10 h-10 rounded-xl bg-gray-200 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3.5 rounded-full bg-gray-200 w-4/5"></div><div class="h-3 rounded-full bg-gray-200 w-1/3"></div></div></div>
    </div>
  </div>
</main>

<!-- BOTTOM NAV -->
<nav class="fixed bottom-0 left-0 right-0 z-20 bg-white border-t border-gray-100" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="flex h-16">
    <a href="dashboard.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="text-[0.55rem] font-semibold">Início</span>
    </a>
    <a href="agenda.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-vitta-500">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="text-[0.55rem] font-bold">Agenda</span>
    </a>
    <a href="consultas.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="text-[0.55rem] font-semibold">Consultas</span>
    </a>
    <a href="pacientes.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span class="text-[0.55rem] font-semibold">Pacientes</span>
    </a>
    <a href="financeiro.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span class="text-[0.55rem] font-semibold">Financeiro</span>
    </a>
  </div>
</nav>

<!-- SHEET: Detalhe do agendamento -->
<div id="sheet-overlay" class="hidden fixed inset-0 bg-black/40 z-30" onclick="closeSheet()"></div>
<div id="sheet" class="fixed bottom-0 left-0 right-0 z-40 bg-white rounded-t-3xl shadow-2xl sheet" style="transform:translateY(100%);opacity:0;padding-bottom:env(safe-area-inset-bottom)">
  <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto mt-3 mb-4"></div>
  <div id="sheet-content" class="px-5 pb-6 space-y-4"></div>
</div>

<script>
const AV_COLORS=['bg-blue-500','bg-emerald-500','bg-violet-500','bg-amber-500','bg-rose-500','bg-cyan-500'];
const STATUS_BADGE={AGENDADO:'bg-blue-100 text-blue-700',CONFIRMADA:'bg-emerald-100 text-emerald-700',REALIZADA:'bg-vitta-100 text-vitta-700',FALTA:'bg-red-100 text-red-700',SEM_VALOR:'bg-amber-100 text-amber-700',FEEDBACK:'bg-pink-100 text-pink-700'};
const STATUS_LABEL={AGENDADO:'Agendado',CONFIRMADA:'Confirmada',REALIZADA:'Realizada',FALTA:'Falta',SEM_VALOR:'Sem Valor',FEEDBACK:'Feedback'};
const STATUS_COLORS={AGENDADO:'#3B82F6',CONFIRMADA:'#10B981',SEM_VALOR:'#F59E0B',FALTA:'#EF4444',REALIZADA:'#2ABCD4',FEEDBACK:'#EC4899'};

let viewDate=new Date(), profId=null, idEmp=null, allAgds=[];

function avColor(n){let h=0;for(const c of(n||''))h=(h<<5)-h+c.charCodeAt(0);return AV_COLORS[Math.abs(h)%AV_COLORS.length];}
function initials(n){return(n||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function fmtTime(dt){return new Date(dt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function calcAge(d){if(!d)return null;const dt=new Date(d),n=new Date();let a=n.getFullYear()-dt.getFullYear();if(n<new Date(n.getFullYear(),dt.getMonth(),dt.getDate()))a--;return a;}
async function handleLogout(){
  try { await Capacitor.Plugins.Preferences.remove({ key: 'vitta_session' }); } catch(e) {}
  await supabase.auth.signOut();
  window.location.href='../index.html';
}

function updateDateLabels(){
  const t=new Date(),tm=new Date(t);tm.setDate(t.getDate()+1);
  document.getElementById('date-label').textContent=viewDate.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'}).replace(/\./g,'');
  const same=(a,b)=>a.toDateString()===b.toDateString();
  document.getElementById('date-rel').textContent=same(viewDate,t)?'Hoje':same(viewDate,tm)?'Amanhã':'';
}

function navDay(d){viewDate=new Date(viewDate);viewDate.setDate(viewDate.getDate()+d);updateDateLabels();loadAgendamentos();}
function goToday(){viewDate=new Date();updateDateLabels();loadAgendamentos();}

async function loadAgendamentos(){
  const el=document.getElementById('agd-list');
  if(!document.getElementById('agd-skeleton')){
    el.innerHTML=`<div id="agd-skeleton" class="space-y-2">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center gap-3"><div class="w-10 h-10 rounded bg-gray-200 shrink-0"></div><div class="w-10 h-10 rounded-xl bg-gray-200 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3.5 rounded-full bg-gray-200 w-3/4"></div><div class="h-3 rounded-full bg-gray-200 w-1/2"></div></div></div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center gap-3"><div class="w-10 h-10 rounded bg-gray-200 shrink-0"></div><div class="w-10 h-10 rounded-xl bg-gray-200 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3.5 rounded-full bg-gray-200 w-2/3"></div><div class="h-3 rounded-full bg-gray-200 w-2/5"></div></div></div>
    </div>`;
  }
  const d0=new Date(viewDate.getFullYear(),viewDate.getMonth(),viewDate.getDate()).toISOString();
  const d1=new Date(viewDate.getFullYear(),viewDate.getMonth(),viewDate.getDate(),23,59,59,999).toISOString();
  const {data}=await supabase.from('AGENDAMENTO')
    .select('ID_AGD,DT_AGD,DT_FIM_AGD,STATUS_AGD,TIPO_AGD,OBS_AGD,PAC_AGD,SALA_AGD,LINK_AGD,PACIENTE!PAC_AGD(ID_PAC,NOME_PAC,DTNASC_PAC,TEL_PAC),SALA!SALA_AGD(NOME_SALA)')
    .eq('ID_EMP',idEmp).eq('PROF_AGD',profId)
    .gte('DT_AGD',d0).lte('DT_AGD',d1).order('DT_AGD');
  allAgds=data||[];
  document.getElementById('agd-skeleton')?.remove();
  if(viewDate.toDateString()===new Date().toDateString()) scheduleAppointmentNotifications(allAgds);
  renderList();
}

function renderList(){
  const el=document.getElementById('agd-list');
  if(!allAgds.length){
    el.innerHTML=`<div class="bg-white rounded-2xl border border-gray-100 py-16 text-center">
      <svg class="w-10 h-10 text-gray-200 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <p class="text-gray-400 text-sm">Nenhuma consulta para este dia</p></div>`;
    return;
  }
  el.innerHTML=allAgds.map((a,i)=>{
    const pac=a.PACIENTE||{};
    const col=avColor(pac.NOME_PAC);
    const bs=STATUS_BADGE[a.STATUS_AGD]||'bg-gray-100 text-gray-600';
    const bl=STATUS_LABEL[a.STATUS_AGD]||a.STATUS_AGD;
    const sc=STATUS_COLORS[a.STATUS_AGD]||'#6b7280';
    return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 fade-up flex items-center gap-3 active:bg-gray-50" style="animation-delay:${i*0.04}s" onclick="openSheet('${a.ID_AGD}')">
      <div class="flex flex-col items-center shrink-0 w-10">
        <span class="text-[0.78rem] font-bold text-gray-700">${fmtTime(a.DT_AGD)}</span>
        <div class="w-0.5 flex-1 min-h-[20px] mt-1 rounded-full" style="background:${sc}"></div>
        <span class="text-[0.65rem] text-gray-400">${fmtTime(a.DT_FIM_AGD)}</span>
      </div>
      <div class="${col} w-10 h-10 rounded-xl flex items-center justify-center text-white text-xs font-bold shrink-0">${initials(pac.NOME_PAC)}</div>
      <div class="flex-1 min-w-0">
        <p class="text-[0.88rem] font-semibold text-gray-800 truncate">${pac.NOME_PAC||'—'}</p>
        <p class="text-[0.72rem] text-gray-400">${a.TIPO_AGD==='ONLINE'?'🌐 Online':'🏥 Presencial'}${a.SALA?.NOME_SALA?' · '+a.SALA.NOME_SALA:''}</p>
      </div>
      ${(a.TIPO_AGD==='ONLINE'&&a.LINK_AGD)?`<button onclick="event.stopPropagation();abrirVideoChamada('${a.ID_AGD}')" class="shrink-0 w-9 h-9 rounded-xl bg-emerald-500 text-white flex items-center justify-center active:bg-emerald-600">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>`:''}
      <span class="text-[0.65rem] font-bold ${bs} px-2 py-0.5 rounded-full shrink-0">${bl}</span>
    </div>`;
  }).join('');
}

function abrirVideoChamada(id){
  const a=allAgds.find(x=>x.ID_AGD===id);
  if(a?.LINK_AGD) abrirLinkExterno(a.LINK_AGD);
}

function openSheet(id){
  const a=allAgds.find(x=>x.ID_AGD===id);
  if(!a)return;
  const pac=a.PACIENTE||{};
  const age=calcAge(pac.DTNASC_PAC);
  const bs=STATUS_BADGE[a.STATUS_AGD]||'bg-gray-100 text-gray-600';
  const bl=STATUS_LABEL[a.STATUS_AGD]||a.STATUS_AGD;
  document.getElementById('sheet-content').innerHTML=`
    <div class="flex items-center gap-3">
      <div class="${avColor(pac.NOME_PAC)} w-12 h-12 rounded-2xl flex items-center justify-center text-white font-bold text-base shrink-0">${initials(pac.NOME_PAC)}</div>
      <div class="flex-1 min-w-0">
        <p class="text-[1rem] font-bold text-gray-800">${pac.NOME_PAC||'—'}</p>
        <p class="text-[0.75rem] text-gray-500">${age?age+' anos · ':''} ${pac.TEL_PAC||''}</p>
      </div>
      <span class="text-[0.68rem] font-bold ${bs} px-2.5 py-1 rounded-full">${bl}</span>
    </div>
    <div class="flex flex-wrap gap-x-4 gap-y-1 text-[0.78rem] text-gray-600 bg-gray-50 rounded-xl px-3 py-2.5">
      <span>🕐 ${fmtTime(a.DT_AGD)} – ${fmtTime(a.DT_FIM_AGD)}</span>
      <span>${a.TIPO_AGD==='ONLINE'?'🌐 Online':'🏥 Presencial'}</span>
      ${a.SALA?.NOME_SALA?`<span>📍 ${a.SALA.NOME_SALA}</span>`:''}
    </div>
    ${a.OBS_AGD?`<div class="bg-amber-50 border border-amber-100 rounded-xl px-3 py-2.5 text-[0.78rem] text-amber-800">${a.OBS_AGD}</div>`:''}
    ${(a.TIPO_AGD==='ONLINE'&&a.LINK_AGD)?`<button onclick="abrirVideoChamada('${a.ID_AGD}')" class="w-full py-3.5 bg-emerald-500 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 active:bg-emerald-600">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Entrar na Videochamada
    </button>`:''}
    <a href="prontuario.html?pac=${a.PAC_AGD}" class="w-full py-3.5 bg-vitta-500 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 active:bg-vitta-600">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Ir para Prontuário
    </a>`;
  document.getElementById('sheet-overlay').classList.remove('hidden');
  setTimeout(()=>document.getElementById('sheet').classList.add('open'),10);
}

function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  setTimeout(()=>document.getElementById('sheet-overlay').classList.add('hidden'),300);
}

(async()=>{
  const {data:{session}}=await supabase.auth.getSession();
  if(!session){window.location.href='../index.html';return;}
  const meta=session.user.user_metadata;
  if(!['PROFISSIONAL','ADMIN_EMPRESA'].includes(meta.tipo_usu)){window.location.href='access-denied.html';return;}
  const u=await getUsuarioAtual('PROF_USU,NOME_USU,ID_EMP',session);
  if(meta.tipo_usu==='ADMIN_EMPRESA' && !u?.PROF_USU){window.location.href='access-denied.html';return;}
  profId=u?.PROF_USU; idEmp=u?.ID_EMP||meta.id_emp;
  document.getElementById('hdr-av').textContent=initials(u?.NOME_USU||meta.nome_usu||session.user.email);
  updateDateLabels();
  await loadAgendamentos();
  initPullToRefresh(loadAgendamentos);
})();
</script>
</body>
</html>
