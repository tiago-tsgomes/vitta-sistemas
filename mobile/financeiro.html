<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Financeiro — Vitta</title>
  <link rel="icon" type="image/png" href="../img/favicon.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{vitta:{50:'#f0fbfd',100:'#e0f7fa',500:'#2ABCD4',600:'#1a96ac'}},fontFamily:{sans:['Montserrat','system-ui','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <link rel="stylesheet" href="../assets/css/mobile-dark.css"/>
  <script src="../assets/js/mobile-utils.js"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent}
    body{overscroll-behavior-y:none}
    ::-webkit-scrollbar{display:none}
    .safe-top{padding-top:env(safe-area-inset-top)}
    .tab-btn{flex:1;padding:.65rem 0;font-size:.82rem;font-weight:600;color:#9ca3af;border-bottom:2px solid transparent;transition:all .15s;text-align:center}
    .tab-btn.active{color:#2ABCD4;border-bottom-color:#2ABCD4}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .25s ease forwards}
    /* sheet */
    .sheet-panel{transition:transform .3s ease,opacity .25s ease}
    .sheet-panel.open{transform:translateY(0)!important;opacity:1!important}
  </style>
</head>
<body class="bg-[#F0F2F5] font-sans antialiased">

<!-- HEADER -->
<header class="fixed top-0 left-0 right-0 z-20 bg-white border-b border-gray-100 safe-top">
  <div class="h-14 flex items-center px-4 gap-3">
    <h1 class="text-[1rem] font-bold text-gray-800 flex-1">Financeiro</h1>
    <button id="btn-filter" onclick="toggleFilter()" class="p-2 rounded-xl bg-gray-100 text-gray-500 relative">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      <span id="filter-dot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-vitta-500 rounded-full"></span>
    </button>
    <button id="hdr-av" onclick="window.location.href='perfil.html'" class="w-8 h-8 rounded-full bg-vitta-500 flex items-center justify-center text-white text-xs font-bold">A</button>
  </div>
  <!-- Internal tabs -->
  <div class="flex border-b border-gray-100 px-0">
    <button id="itab-lanc" class="tab-btn active" onclick="switchInnerTab('lanc')">Lançamentos</button>
    <button id="itab-rel"  class="tab-btn"        onclick="switchInnerTab('rel')">Relatórios</button>
  </div>
</header>

<!-- Filter panel (slide down) -->
<div id="filter-panel" class="hidden fixed top-0 left-0 right-0 z-30 bg-white border-b border-gray-200 shadow-md" style="padding-top:calc(112px + env(safe-area-inset-top))">
  <div class="px-4 pb-4 space-y-3">
    <div class="grid grid-cols-2 gap-2">
      <div>
        <p class="text-[0.7rem] text-gray-500 font-semibold mb-1">De</p>
        <input id="fDtDe" type="date" class="w-full py-2.5 px-3 text-sm border border-gray-200 rounded-xl outline-none focus:border-vitta-500 bg-gray-50"/>
      </div>
      <div>
        <p class="text-[0.7rem] text-gray-500 font-semibold mb-1">Até</p>
        <input id="fDtAte" type="date" class="w-full py-2.5 px-3 text-sm border border-gray-200 rounded-xl outline-none focus:border-vitta-500 bg-gray-50"/>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="clearFilter()" class="flex-1 py-2.5 border border-gray-200 rounded-xl text-sm font-semibold text-gray-600 active:bg-gray-50">Limpar</button>
      <button onclick="applyFilter()" class="flex-1 py-2.5 bg-vitta-500 text-white rounded-xl text-sm font-bold active:bg-vitta-600">Aplicar</button>
    </div>
  </div>
</div>
<div id="filter-overlay" class="hidden fixed inset-0 z-20" onclick="closeFilter()"></div>

<!-- MAIN -->
<main style="padding-top:calc(108px + env(safe-area-inset-top));padding-bottom:calc(80px + env(safe-area-inset-bottom))" class="min-h-screen">

  <!-- ══ PANE: Lançamentos ══ -->
  <div id="pane-lanc" class="px-4 py-3 space-y-3">

    <!-- Summary strip -->
    <div id="lanc-summary" class="hidden grid grid-cols-2 gap-2.5">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 text-center">
        <p id="vl-pendente" class="text-[1.15rem] font-extrabold text-amber-500 leading-none">R$ 0</p>
        <p class="text-[0.6rem] text-gray-400 mt-1 font-semibold uppercase tracking-wide">A Receber</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 text-center">
        <p id="vl-recebido" class="text-[1.15rem] font-extrabold text-emerald-500 leading-none">R$ 0</p>
        <p class="text-[0.6rem] text-gray-400 mt-1 font-semibold uppercase tracking-wide">Recebido</p>
      </div>
    </div>

    <!-- Period label -->
    <div id="lanc-period" class="hidden px-1">
      <p id="lanc-period-txt" class="text-[0.68rem] text-gray-400"></p>
    </div>

    <!-- List -->
    <div id="lanc-list">
      <div class="flex items-center justify-center gap-2 h-32 text-gray-400 text-sm">
        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
        Carregando…
      </div>
    </div>
  </div>

  <!-- ══ PANE: Relatórios ══ -->
  <div id="pane-rel" class="hidden px-4 py-3 space-y-3">

    <!-- KPIs -->
    <div class="grid grid-cols-2 gap-2.5">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 text-center">
        <p id="rel-total" class="text-[1.35rem] font-extrabold text-gray-800 leading-none">—</p>
        <p class="text-[0.6rem] text-gray-400 mt-1 font-semibold uppercase tracking-wide">Consultas</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 text-center">
        <p id="rel-realizadas" class="text-[1.35rem] font-extrabold text-vitta-500 leading-none">—</p>
        <p class="text-[0.6rem] text-gray-400 mt-1 font-semibold uppercase tracking-wide">Realizadas</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 text-center">
        <p id="rel-faltas" class="text-[1.35rem] font-extrabold text-red-400 leading-none">—</p>
        <p class="text-[0.6rem] text-gray-400 mt-1 font-semibold uppercase tracking-wide">Faltas</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 text-center">
        <p id="rel-taxa" class="text-[1.35rem] font-extrabold text-emerald-500 leading-none">—</p>
        <p class="text-[0.6rem] text-gray-400 mt-1 font-semibold uppercase tracking-wide">Aderência</p>
      </div>
    </div>

    <!-- Revenue card -->
    <div class="bg-gradient-to-br from-vitta-500 to-vitta-600 rounded-2xl p-4 shadow-md">
      <p class="text-vitta-100 text-[0.68rem] font-bold uppercase tracking-wide mb-1">Receita no Período</p>
      <p id="rel-receita" class="text-white text-[1.5rem] font-extrabold leading-none">R$ 0,00</p>
      <p id="rel-pendente-txt" class="text-vitta-200 text-[0.72rem] mt-1"></p>
    </div>

    <!-- Repasse / Líquido -->
    <div class="grid grid-cols-2 gap-2.5">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-7 h-7 rounded-lg bg-rose-100 flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
          </div>
          <p class="text-[0.6rem] font-bold text-gray-400 uppercase tracking-wide leading-tight">Repasse à Clínica</p>
        </div>
        <p id="rel-repasse" class="text-[1.1rem] font-extrabold text-gray-800 leading-none">R$ 0,00</p>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-7 h-7 rounded-lg bg-teal-100 flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
          </div>
          <p class="text-[0.6rem] font-bold text-gray-400 uppercase tracking-wide leading-tight">Líquido Profissionais</p>
        </div>
        <p id="rel-liquido" class="text-[1.1rem] font-extrabold text-gray-800 leading-none">R$ 0,00</p>
      </div>
    </div>

    <!-- Consultas list -->
    <div>
      <p class="text-[0.7rem] font-bold text-gray-400 uppercase tracking-wider mb-2 px-1">Consultas no Período</p>
      <div id="rel-list">
        <div class="flex items-center justify-center gap-2 h-24 text-gray-400 text-sm bg-white rounded-2xl border border-gray-100">
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
          Carregando…
        </div>
      </div>
    </div>
  </div>

</main>

<!-- BOTTOM NAV (5 tabs) -->
<nav class="fixed bottom-0 left-0 right-0 z-20 bg-white border-t border-gray-100" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="flex h-16">
    <a href="dashboard.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="text-[0.55rem] font-semibold">Início</span>
    </a>
    <a href="agenda.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="text-[0.55rem] font-semibold">Agenda</span>
    </a>
    <a href="consultas.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="text-[0.55rem] font-semibold">Consultas</span>
    </a>
    <a href="pacientes.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span class="text-[0.55rem] font-semibold">Pacientes</span>
    </a>
    <a href="financeiro.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-vitta-500">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span class="text-[0.55rem] font-bold">Financeiro</span>
    </a>
  </div>
</nav>

<!-- Sheet: detalhe lançamento -->
<div id="sheet-overlay" class="hidden fixed inset-0 bg-black/40 z-30" onclick="closeSheet()"></div>
<div id="sheet" class="fixed bottom-0 left-0 right-0 z-40 bg-white rounded-t-3xl shadow-2xl sheet-panel" style="transform:translateY(100%);opacity:0;padding-bottom:env(safe-area-inset-bottom)">
  <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto mt-3 mb-4"></div>
  <div id="sheet-content" class="px-5 pb-6 space-y-3"></div>
</div>

<script>
const AV_COLORS=['bg-blue-500','bg-emerald-500','bg-violet-500','bg-amber-500','bg-rose-500','bg-cyan-500'];
const FORMA_LABELS={PIX:'Pix',DINHEIRO:'Dinheiro',CARTAO_CREDITO:'Cartão Crédito',CARTAO_DEBITO:'Cartão Débito',TRANSFERENCIA:'Transferência',BOLETO:'Boleto'};
let profId=null, idEmp=null, allLanc=[], allServ=[], allRel=[], innerTab='lanc', filterOpen=false, percProf=0;

function avColor(n){let h=0;for(const c of(n||''))h=(h<<5)-h+c.charCodeAt(0);return AV_COLORS[Math.abs(h)%AV_COLORS.length];}
function initials(n){return(n||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtTime(d){return new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function fmtBRL(v){return'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
async function handleLogout(){
  try { await Capacitor.Plugins.Preferences.remove({ key: 'vitta_session' }); } catch(e) {}
  await supabase.auth.signOut();
  window.location.href='../index.html';
}

function switchInnerTab(t){
  innerTab=t;
  ['lanc','rel'].forEach(k=>{
    document.getElementById('itab-'+k).classList.toggle('active',k===t);
    document.getElementById('pane-'+k).classList.toggle('hidden',k!==t);
  });
  if(t==='rel'&&!allRel.length) loadRelatorios();
}

function toggleFilter(){
  filterOpen=!filterOpen;
  document.getElementById('filter-panel').classList.toggle('hidden',!filterOpen);
  document.getElementById('filter-overlay').classList.toggle('hidden',!filterOpen);
}
function closeFilter(){filterOpen=false;document.getElementById('filter-panel').classList.add('hidden');document.getElementById('filter-overlay').classList.add('hidden');}
function applyFilter(){
  closeFilter();
  const dot=document.getElementById('filter-dot');
  dot.classList.toggle('hidden',!document.getElementById('fDtDe').value&&!document.getElementById('fDtAte').value);
  loadLancamentos();
  if(innerTab==='rel') loadRelatorios();
}
function clearFilter(){
  document.getElementById('fDtDe').value='';
  document.getElementById('fDtAte').value='';
  document.getElementById('filter-dot').classList.add('hidden');
  closeFilter();
  loadLancamentos();
  if(innerTab==='rel') loadRelatorios();
}

function openSheet(id){
  const item=allLanc.find(a=>a.ID_AGD===id);
  if(!item)return;
  const pac=item.PACIENTE?.NOME_PAC||'—';
  const serv=allServ.find(s=>s.ID_PROF===item.PROF_AGD);
  const vlServ=serv?.VALOR_1CONS?fmtBRL(serv.VALOR_1CONS):'—';
  const isEstornado=!!item.pagamento?.ESTORNADO_PGTO;
  const isPago=!!item.pagamento&&!isEstornado;
  const forma=item.pagamento?(item.pagamento.TIPPAG?.NOME_TIPPAG||FORMA_LABELS[item.pagamento.FORMA_PGTO]||'—'):'—';
  const statusBg=isEstornado?'bg-red-100 text-red-700':isPago?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700';
  const statusTxt=isEstornado?'Estornado':isPago?'Pago':'Pendente';

  document.getElementById('sheet-content').innerHTML=`
    <div class="flex items-center gap-3">
      <div class="${avColor(pac)} w-11 h-11 rounded-2xl flex items-center justify-center text-white font-bold text-sm shrink-0">${initials(pac)}</div>
      <div class="flex-1 min-w-0">
        <p class="font-bold text-gray-800 text-[0.95rem] truncate">${pac}</p>
        <p class="text-[0.72rem] text-gray-500">${fmtDate(item.DT_AGD)} às ${fmtTime(item.DT_AGD)}</p>
      </div>
      <span class="text-[0.68rem] font-bold ${statusBg} px-2.5 py-1 rounded-full shrink-0">${statusTxt}</span>
    </div>
    <div class="bg-gray-50 rounded-2xl p-3.5 space-y-2 text-[0.82rem]">
      <div class="flex justify-between"><span class="text-gray-500">Valor do serviço</span><span class="font-semibold text-gray-800">${vlServ}</span></div>
      ${isPago?`
      <div class="flex justify-between"><span class="text-gray-500">Valor pago</span><span class="font-bold text-emerald-600">${fmtBRL(item.pagamento.VL_PGTO)}</span></div>
      <div class="flex justify-between"><span class="text-gray-500">Data do pagamento</span><span class="text-gray-700">${fmtDate(item.pagamento.DT_PGTO)}</span></div>
      <div class="flex justify-between"><span class="text-gray-500">Forma</span><span class="text-gray-700">${forma}</span></div>
      ${item.pagamento.COMPROVANTE?`<div class="flex justify-between"><span class="text-gray-500">Comprovante</span><span class="text-gray-700 truncate max-w-[160px]">${item.pagamento.COMPROVANTE}</span></div>`:''}
      `:'<p class="text-amber-600 text-[0.78rem] font-medium text-center py-1">Pagamento ainda não registrado</p>'}
    </div>`;

  document.getElementById('sheet-overlay').classList.remove('hidden');
  setTimeout(()=>document.getElementById('sheet').classList.add('open'),10);
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  setTimeout(()=>document.getElementById('sheet-overlay').classList.add('hidden'),300);
}

async function loadLancamentos(){
  document.getElementById('lanc-list').innerHTML='<div class="flex items-center justify-center gap-2 h-32 text-gray-400 text-sm"><svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>Carregando…</div>';
  document.getElementById('lanc-summary').classList.add('hidden');
  document.getElementById('lanc-period').classList.add('hidden');

  const dtDe=document.getElementById('fDtDe').value;
  const dtAte=document.getElementById('fDtAte').value;

  let q=supabase.from('AGENDAMENTO')
    .select('ID_AGD,DT_AGD,PAC_AGD,PROF_AGD,ID_EMP,PACIENTE!PAC_AGD(NOME_PAC)')
    .eq('PGTO_AGD',true).eq('PROF_AGD',profId).eq('ID_EMP',idEmp)
    .order('DT_AGD',{ascending:false});
  if(dtDe)q=q.gte('DT_AGD',dtDe+'T00:00:00');
  if(dtAte)q=q.lte('DT_AGD',dtAte+'T23:59:59');
  const {data:agds}=await q;
  const agdList=agds||[];

  let pagamentos=[];
  if(agdList.length){
    const ids=agdList.map(a=>a.ID_AGD);
    const {data:pgtos}=await supabase.from('PAGAMENTO').select('*,TIPPAG(ID_TIPPAG,NOME_TIPPAG)').in('ID_AGD',ids);
    pagamentos=pgtos||[];
  }
  allLanc=agdList.map(a=>({...a,pagamento:pagamentos.find(p=>p.ID_AGD===a.ID_AGD)||null}));

  // Summary
  let vlPend=0, vlRec=0;
  allLanc.forEach(a=>{
    const serv=allServ.find(s=>s.ID_PROF===a.PROF_AGD);
    const isEstornado=!!a.pagamento?.ESTORNADO_PGTO;
    const isPago=!!a.pagamento&&!isEstornado;
    if(!isPago) vlPend+=Number(serv?.VALOR_1CONS||0);
    else vlRec+=Number(a.pagamento.VL_PGTO||0);
  });

  if(allLanc.length){
    document.getElementById('lanc-summary').classList.remove('hidden');
    document.getElementById('vl-pendente').textContent=fmtBRL(vlPend);
    document.getElementById('vl-recebido').textContent=fmtBRL(vlRec);
  }

  if(dtDe||dtAte){
    document.getElementById('lanc-period').classList.remove('hidden');
    document.getElementById('lanc-period-txt').textContent=`Período: ${dtDe?fmtDate(dtDe+'T12:00'):'início'} até ${dtAte?fmtDate(dtAte+'T12:00'):'hoje'} · ${allLanc.length} lançamento(s)`;
  }

  renderLancamentos();
}

function renderLancamentos(){
  const el=document.getElementById('lanc-list');
  if(!allLanc.length){
    el.innerHTML='<div class="bg-white rounded-2xl border border-gray-100 py-14 text-center"><svg class="w-10 h-10 text-gray-200 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><p class="text-gray-400 text-sm">Nenhum lançamento no período</p></div>';
    return;
  }
  el.innerHTML=allLanc.map((a,i)=>{
    const pac=a.PACIENTE?.NOME_PAC||'—';
    const serv=allServ.find(s=>s.ID_PROF===a.PROF_AGD);
    const vlServ=serv?.VALOR_1CONS?fmtBRL(serv.VALOR_1CONS):'—';
    const isEstornado=!!a.pagamento?.ESTORNADO_PGTO;
    const isPago=!!a.pagamento&&!isEstornado;
    const statusBg=isEstornado?'bg-red-100 text-red-700':isPago?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700';
    const statusTxt=isEstornado?'Estornado':isPago?'Pago':'Pendente';
    const vlPago=isPago?fmtBRL(a.pagamento.VL_PGTO):vlServ;
    return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 fade-up flex items-center gap-3 active:bg-gray-50" style="animation-delay:${i*0.03}s" onclick="openSheet('${a.ID_AGD}')">
      <div class="${avColor(pac)} w-10 h-10 rounded-xl flex items-center justify-center text-white text-xs font-bold shrink-0">${initials(pac)}</div>
      <div class="flex-1 min-w-0">
        <p class="text-[0.88rem] font-semibold text-gray-800 truncate">${pac}</p>
        <p class="text-[0.72rem] text-gray-400">${fmtDate(a.DT_AGD)}</p>
      </div>
      <div class="shrink-0 text-right">
        <p class="text-[0.88rem] font-bold ${isPago?'text-emerald-600':'text-gray-600'}">${vlPago}</p>
        <span class="text-[0.62rem] font-bold ${statusBg} px-1.5 py-0.5 rounded-full">${statusTxt}</span>
      </div>
    </div>`;
  }).join('');
}

async function loadRelatorios(){
  document.getElementById('rel-list').innerHTML='<div class="flex items-center justify-center gap-2 h-24 text-gray-400 text-sm bg-white rounded-2xl border border-gray-100"><svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>Carregando…</div>';

  const dtDe=document.getElementById('fDtDe').value;
  const dtAte=document.getElementById('fDtAte').value;
  const today=new Date();
  const from=dtDe||(new Date(today.getFullYear(),today.getMonth(),1).toISOString().split('T')[0]);
  const to=dtAte||(today.toISOString().split('T')[0]);

  let q=supabase.from('AGENDAMENTO')
    .select('ID_AGD,DT_AGD,STATUS_AGD,TIPO_AGD,PAC_AGD,PROF_AGD,PGTO_AGD,PACIENTE!PAC_AGD(NOME_PAC)')
    .eq('PROF_AGD',profId).eq('ID_EMP',idEmp)
    .gte('DT_AGD',from+'T00:00:00').lte('DT_AGD',to+'T23:59:59')
    .order('DT_AGD',{ascending:false});
  const {data:agds}=await q;
  allRel=agds||[];

  const total=allRel.length;
  const realizadas=allRel.filter(a=>a.STATUS_AGD==='REALIZADA').length;
  const faltas=allRel.filter(a=>a.STATUS_AGD==='FALTA').length;
  const taxa=total>0?Math.round((realizadas/total)*100):0;
  document.getElementById('rel-total').textContent=total;
  document.getElementById('rel-realizadas').textContent=realizadas;
  document.getElementById('rel-faltas').textContent=faltas;
  document.getElementById('rel-taxa').textContent=taxa+'%';

  // Receita: pagamentos das realizadas
  const realIds=allRel.filter(a=>a.STATUS_AGD==='REALIZADA'&&a.PGTO_AGD).map(a=>a.ID_AGD);
  let receita=0, pendente=0;
  if(realIds.length){
    const {data:pgtos}=await supabase.from('PAGAMENTO').select('VL_PGTO,ESTORNADO_PGTO').in('ID_AGD',realIds);
    (pgtos||[]).forEach(p=>{if(!p.ESTORNADO_PGTO) receita+=Number(p.VL_PGTO||0);});
  }
  // Pendente: serviços sem pagamento
  const pendIds=allRel.filter(a=>a.STATUS_AGD==='REALIZADA'&&!a.PGTO_AGD).length;
  const serv=allServ.find(s=>s.ID_PROF===profId);
  pendente=pendIds*Number(serv?.VALOR_1CONS||0);
  document.getElementById('rel-receita').textContent=fmtBRL(receita);
  document.getElementById('rel-pendente-txt').textContent=pendente>0?`+ ${fmtBRL(pendente)} pendente de lançamento`:'Sem valores pendentes de lançamento';

  // Repasse à clínica: % cadastrado no profissional sobre a receita recebida
  const repasse=receita*percProf/100;
  document.getElementById('rel-repasse').textContent=fmtBRL(repasse);
  document.getElementById('rel-liquido').textContent=fmtBRL(receita-repasse);

  // Lista
  const STATUS_BADGE={AGENDADO:'bg-blue-100 text-blue-700',CONFIRMADA:'bg-emerald-100 text-emerald-700',REALIZADA:'bg-vitta-100 text-vitta-700',FALTA:'bg-red-100 text-red-700',SEM_VALOR:'bg-amber-100 text-amber-700',FEEDBACK:'bg-pink-100 text-pink-700'};
  const STATUS_LABEL={AGENDADO:'Agendado',CONFIRMADA:'Confirmada',REALIZADA:'Realizada',FALTA:'Falta',SEM_VALOR:'Sem Valor',FEEDBACK:'Feedback'};
  const el=document.getElementById('rel-list');
  if(!allRel.length){el.innerHTML='<div class="bg-white rounded-2xl border border-gray-100 py-10 text-center text-gray-400 text-sm">Nenhuma consulta no período</div>';return;}
  el.innerHTML=allRel.map((a,i)=>{
    const pac=a.PACIENTE?.NOME_PAC||'—';
    const bs=STATUS_BADGE[a.STATUS_AGD]||'bg-gray-100 text-gray-600';
    const bl=STATUS_LABEL[a.STATUS_AGD]||a.STATUS_AGD;
    return `<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 fade-up flex items-center gap-3" style="animation-delay:${i*0.025}s">
      <div class="${avColor(pac)} w-9 h-9 rounded-xl flex items-center justify-center text-white text-xs font-bold shrink-0">${initials(pac)}</div>
      <div class="flex-1 min-w-0">
        <p class="text-[0.85rem] font-semibold text-gray-800 truncate">${pac}</p>
        <p class="text-[0.7rem] text-gray-400">${fmtDate(a.DT_AGD)} · ${a.TIPO_AGD==='ONLINE'?'Online':'Presencial'}</p>
      </div>
      <span class="text-[0.62rem] font-bold ${bs} px-2 py-0.5 rounded-full shrink-0">${bl}</span>
    </div>`;
  }).join('');
}

(async()=>{
  const {data:{session}}=await supabase.auth.getSession();
  if(!session){window.location.href='../index.html';return;}
  const meta=session.user.user_metadata;
  if(!['PROFISSIONAL','ADMIN_EMPRESA'].includes(meta.tipo_usu)){window.location.href='access-denied.html';return;}
  const u=await getUsuarioAtual('PROF_USU,NOME_USU,ID_EMP',session);
  if(meta.tipo_usu==='ADMIN_EMPRESA' && !u?.PROF_USU){window.location.href='access-denied.html';return;}
  profId=u?.PROF_USU; idEmp=u?.ID_EMP||meta.id_emp;
  document.getElementById('hdr-av').textContent=initials(u?.NOME_USU||meta.nome_usu||session.user.email);

  // Default period: mes atual
  const today=new Date();
  document.getElementById('fDtDe').value=new Date(today.getFullYear(),today.getMonth(),1).toISOString().split('T')[0];
  document.getElementById('fDtAte').value=today.toISOString().split('T')[0];
  document.getElementById('filter-dot').classList.remove('hidden');

  // Serviços do profissional
  const {data:servs}=await supabase.from('SERVICO').select('ID_SERV,ID_PROF,VALOR_1CONS,CHAVE_PIX').eq('ID_PROF',profId).eq('ATIVO_SERV',true);
  allServ=servs||[];

  // % de repasse cadastrado no profissional
  const {data:profRow}=await supabase.from('PROFISSIONAL').select('PERC_PROF').eq('ID_PROF',profId).single();
  percProf=Number(profRow?.PERC_PROF||0);

  await loadLancamentos();
})();
</script>
