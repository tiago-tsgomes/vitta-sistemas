name: Deploy Vitta Sistemas

on:
  push:
    branches: [main]

jobs:
  deploy-app:
    name: Deploy sistema (app.vittasistemas.com.br)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_APP }}
          password: ${{ secrets.FTP_PASSWORD_APP }}
          server-dir: ./
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/android/**
            **/ios/**
            **/www/**
            **/bi/**
            **/Site/**
            **/supabase/**
            **/.claude/**
            **/.vscode/**
            **/Documentos/**
            **/Recuperados/**
            **/Arquivo.zip
            **/*.md
            capacitor.config.json
            package.json
            package-lock.json
            serve.sh
            suporte.html
            manual-publicacao.html

  deploy-bi:
    name: Deploy BI (bi.vittasistemas.com.br)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_BI }}
          password: ${{ secrets.FTP_PASSWORD_BI }}
          server-dir: ./
          local-dir: ./bi/
          exclude: |
            **/.git*
            **/Arquivo.zip
            **/*.md
